            value: 'No Known Copyright'
      '#markup': '<img alt="No Known Copyright" height="31" src="https://rightsstatements.org/files/buttons/NKC.dark-white-interior.png" width="144" />&nbsp;&nbsp;<a href="https://rightsstatements.org/vocab/NKC/1.0/">No Known Copyright</a>'
    rights:
      '#type': textarea
      '#title': 'Local Rights Statement'
      '#states_clear': false
      '#format_items': comma
    notes_details:
      '#type': details
      '#title': 'Notes and Other Information'
      '#states_clear': false
      note:
        '#type': textarea
        '#title': 'General Note'
        '#states_clear': false
        '#format_items': comma
      provenance:
        '#type': textarea
        '#title': Provenance
        '#states_clear': false
        '#format_items': comma
  media:
    '#type': webform_wizard_page
    '#title': 'Upload Files or Describe Physical Format'
    '#open': true
    '#prev_button_label': 'Back to previous step'
    physical_format:
      '#type': select
      '#title': 'Physical Format'
      '#help': 'Please select from the&nbsp;<a href="/admin/structure/webform/config/options/manage">predefined options</a>&nbsp;.'
      '#options': physical_formats
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#label_attributes':
        class:
          - custom-form-input-heading
    physical_format_location:
      '#type': textfield
      '#title': 'Physical Format Location'
      '#description': 'Please provide a location with individual elements separated by semicolon. Include details for Facility (e.g. NYPR HQ); Room (e.g. Vault, Basement, Lab); Range #; Bay #; Shelf #; Box # (if applicable)...'
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#label_attributes':
        class:
          - custom-form-input-heading
    generation:
      '#type': textfield
      '#title': Generation
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    dimensions:
      '#type': textfield
      '#title': Dimensions
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    standard:
      '#type': textfield
      '#title': Standard
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    channel_configuration:
      '#type': textfield
      '#title': 'Channel Configuration'
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    tracks:
      '#type': textfield
      '#title': Tracks
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    duration_physical:
      '#type': textfield
      '#title': Duration
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    time_start:
      '#type': textfield
      '#title': 'Time Start'
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    colors:
      '#type': textfield
      '#title': Colors
      '#states':
        visible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
    images:
      '#type': webform_image_file
      '#title': 'Upload Image Files'
      '#multiple': 10
      '#states_clear': false
      '#format': custom
      '#format_html': '<img src="{{  item.link }}">'
      '#format_items': ol
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
      '#file_preview': ':image'
      '#max_filesize': '512'
      '#file_extensions': 'jp2 jpg jpeg png tif tiff'
    documents:
      '#type': webform_document_file
      '#title': 'Upload Document Files'
      '#multiple': 1000
      '#states':
        visible:
          - ':input[name="type"]':
              value: Painting
          - xor
          - ':input[name="type"]':
              value: ShortStory
          - xor
          - ':input[name="type"]':
              value: Dataset
          - xor
          - ':input[name="type"]':
              value: Podcast
          - xor
          - ':input[name="type"]':
              value: Conversation
          - xor
          - ':input[name="type"]':
              value: NewspaperIssue
          - xor
          - ':input[name="type"]':
              value: PublicationIssue
          - xor
          - ':input[name="type"]':
              value: Article
          - xor
          - ':input[name="type"]':
              value: DigitalDocument
          - xor
          - ':input[name="type"]':
              value: Thesis
          - xor
          - ':input[name="type"]':
              value: Book
          - xor
          - ':input[name="type"]':
              value: Manuscript
      '#states_clear': false
      '#file_placeholder': 'Archipelago is currently only configured to display pdfs via a Viewer, but can still enable download other file types.'
      '#file_extensions': 'txt rtf pdf doc docx odt ppt pptx odp xls xlsx ods csv jsonld'
      '#sanitize': true
    audios:
      '#type': managed_file
      '#title': 'Upload Audio and Transcript Files'
      '#multiple': 5
      '#states':
        visible:
          - ':input[name="type"]':
              value: AudioObject
          - or
          - ':input[name="type"]':
              value: MusicRecording
          - or
          - ':input[name="type"]':
              value: Podcast
          - or
          - ':input[name="type"]':
              value: Conversation
        invisible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
      '#file_preview': file
      '#max_filesize': '512'
      '#file_extensions': 'mp3 wav aif mp2 vtt'
    videos:
      '#type': managed_file
      '#title': 'Upload Video and Transcript Files'
      '#multiple': 5
      '#states':
        visible:
          - ':input[name="type"]':
              value: VideoObject
          - or
          - ':input[name="type"]':
              value: Movie
        invisible:
          ':input[name="media_type"]':
            value: Physical
      '#states_clear': false
      '#format_items': comma
      '#max_filesize': '512'
      '#file_extensions': 'mp4 m4v mov vtt'
    models:
      '#type': managed_file
      '#title': 'Upload 3D Model Files'
      '#multiple': 5
      '#states':
        visible:
          - ':input[name="type"]':
              value: 3DModel
          - or
          - ':input[name="type"]':
              value: Sculpture
      '#states_clear': false
      '#format_items': comma
      '#max_filesize': '512'
      '#file_extensions': 'stl obj mtl'
    upload_associated_warcs:
      '#type': webform_document_file
      '#title': 'Upload Web Archive Files'
      '#states':
        visible:
          ':input[name="type"]':
            value: WebPage
      '#states_clear': false
      '#format_items': comma
      '#uri_scheme': s3
      '#max_filesize': '512'
      '#file_extensions': 'warc warc.gz wacz'
      '#sanitize': true
    large_files:
      '#type': webform_tus_file
      '#title': 'Upload Large Files via Multipart (TUS)'
      '#multiple': 2
      '#states':
        invisible:
          ':input[name="media_type"]':
            value: Physical
      '#file_placeholder': 'Upload a file via TUS'
      '#file_extensions': 'tiff tif mp4 mov zip warc warc.gz wacz'
      '#max_filesize_tus': '4000'
    represents_parent:
      '#type': checkbox
      '#title': 'This object represents/depicts its parent'
      '#description': 'Mark this Checkbox to use this Object as a representative Object of its parent. E.g this can be used to use this Object&#39;s Image as thumbnail when listing/showing a collection.&nbsp;'
      '#states':
        invisible:
          ':input[name="files[images][]"]':
            empty: true
          ':input[name="files[documents][]"]':
            empty: true
          ':input[name="files[videos][]"]':
            empty: true
          ':input[name="ismemberof"]':
            empty: true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Save Metadata'
    '#reset__label': 'Clear Form'
    '#preview_prev_hide': true
