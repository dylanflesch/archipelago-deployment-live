id: nypr_assets_parents_metadata
title: 'NYPR Assets (Parent) Metadata'
description: 'NYPR Assets (Parent) Metadata'
categories:
  - Archipelago
elements: |-
  metadata:
    '#type': webform_wizard_page
    '#title': 'Basic Descriptive Metadata'
    '#access_create_roles':
      - administrator
      - metadata_pro
    '#access_update_roles':
      - authenticated
    '#access_view_roles':
      - authenticated
    '#next_button_label': 'Move on to next step'
    label:
      '#type': textfield
      '#title': Title
      '#description': 'Please provide a brief title for this asset.'
      '#title_display': before
      '#description_display': before
      '#minlength': 3
      '#maxlength': 256
      '#placeholder': 'Title of this Object'
      '#required': true
      '#required_error': 'Please provide a brief title for this asset.'
      '#states_clear': false
      '#label_attributes':
        class:
          - custom-form-input-heading
      '#format_items': comma
      '#access_create_roles':
        - administrator
        - metadata_pro
      '#access_update_roles':
        - administrator
        - metadata_pro
    label_alt:
      '#type': textfield
      '#title': 'Alternative Title'
      '#description': 'Please provide a brief alternative title for this asset.'
      '#title_display': before
      '#description_display': before
      '#minlength': 3
      '#maxlength': 256
      '#placeholder': 'Title of this Object'
      '#required_error': 'Please provide a brief title for this asset.'
      '#states_clear': false
      '#label_attributes':
        class:
          - custom-form-input-heading
      '#format_items': comma
      '#access_create_roles':
        - administrator
        - metadata_pro
      '#access_update_roles':
        - administrator
        - metadata_pro
    type:
      '#type': select
      '#title': Type
      '#help': 'For Digital Object Collections, recommended selections from the&nbsp;<a href="/admin/structure/webform/config/options/manage">predefined options</a>&nbsp;found in the Schema.org Creative Works list are: Collection, Creative Work Series (Compound Object/Collection), Newspaper, or Periodical.'
      '#options': schema_org_cw_collections
      '#required': true
      '#states_clear': false
      '#label_attributes':
        class:
          - custom-form-input-heading
    medium:
      '#type': select
      '#title': Medium
      '#multiple': true
      '#help': 'For Digital Object Collections, recommended selections from the&nbsp;<a href="/admin/structure/webform/config/options/manage">predefined options</a>&nbsp;found in the Schema.org Creative Works list are: Collection, Creative Work Series (Compound Object/Collection), Newspaper, or Periodical.'
      '#options': medium
      '#states':
        visible:
          - ':input[name="type"]':
              value: Episode
          - or
          - ':input[name="type"]':
              value: Segment
      '#states_clear': false
      '#label_attributes':
        class:
          - custom-form-input-heading
    dates_edtf:
      '#type': webform_custom_composite
      '#title': 'Dates (EDTF)'
      '#states_clear': false
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__sorting': false
      '#multiple__add_more': false
      '#element':
        date:
          '#type': webform_edtf_date
          '#title': 'Date (EDTF)'
        date_type:
          '#type': webform_select_other
          '#options': pbcore_datetype_vocabulary
          '#title': 'Date Type'
    date_embargo_lift:
      '#type': date
      '#title': 'Date of Embargo Lift'
      '#description': 'Date that contains an embargo lift date that will be used to Embargo Metadata and Media.'
      '#title_display': before
      '#description_display': before
      '#states':
        visible:
          - ':input[name="type"]':
              value: CreativeWorkSeries
          - or
          - ':input[name="type"]':
              value: Newspaper
          - or
          - ':input[name="type"]':
              value: Periodical
          - or
          - ':input[name="type"]':
              value: Publication
      '#states_clear': false
      '#format_items': comma
      '#access_create_roles':
        - administrator
      '#datepicker': true
    description_fieldset:
      '#type': fieldset
      '#title': Description
      '#states_clear': false
      description_details:
        '#type': details
        '#title': Description
        descriptions:
          '#type': webform_custom_composite
          '#title': Descriptions
          '#multiple': 10
          '#states_clear': false
          '#multiple__min_items': 1
          '#multiple__empty_items': 0
          '#multiple__sorting': false
          '#multiple__add_more': false
          '#element':
            description_type:
              '#type': textfield
              '#title': 'Description Type'
            description:
              '#type': textarea
              '#title': 'Description Value'
    contributor_publisher_fieldset:
      '#type': fieldset
      '#title': 'Contributors and Producing Organization'
      '#help_title': 'Contributors and Publisher Help'
      '#help': 'Individual(s)/Organization(s) responsible for creating the original resource.'
      '#description_display': before
      contributor_lod_details:
        '#type': details
        '#title': Contributors
        '#description': 'You can select to search from the LCNAF&#39;s Personal, Corporate, or Family Names Classes (<a href="https://id.loc.gov/ontologies/madsrdf/v1.html">listed here</a>). Roles information is being sourced from <a href="https://id.loc.gov/vocabulary/relators.html">LoC Relators terms</a>.'
        '#states_clear': false
        contributor_lod:
          '#type': webform_metadata_multiagent
          '#title': Contributors
          '#multiple': true
          '#multiple__min_items': 1
          '#multiple__empty_items': 0
          '#multiple__sorting': false
          '#multiple__add_more': false
          '#format_items': ol
          '#agent_type__placeholder': 'Select Contributor Type'
          '#name_label__title': ' Name'
          '#name_uri__title': 'Contributor URI'
          '#role_uri__title': 'Role URI'
          '#vocab_personal_name': rdftype
          '#rdftype_personal_name': PersonalName
          '#vocab_corporate_name': rdftype
          '#rdftype_corporate_name': CorporateName
          '#vocab_family_name': rdftype
          '#rdftype_family_name': FamilyName
          '#role_type': customlod
          '#role_custom_lod': pbcore_creator_and_contributor_role_vocabulary
      publisher_lod_details:
        '#type': details
        '#title': 'Producing Organization'
        '#description': 'You can select to search from the LCNAF&#39;s Personal, Corporate, or Family Names Classes (<a href="https://id.loc.gov/ontologies/madsrdf/v1.html">listed here</a>). Roles information is being sourced from <a href="https://id.loc.gov/vocabulary/relators.html">LoC Relators terms</a>.'
        publisher_lod:
          '#type': webform_metadata_multiagent
          '#title': 'Producing Organization'
          '#multiple': true
          '#multiple__min_items': 1
          '#multiple__empty_items': 0
          '#multiple__sorting': false
          '#multiple__add_more': false
          '#format_items': ol
          '#agent_type__placeholder': 'Select Publisher Type'
          '#name_label__title': ' Name'
          '#name_uri__title': 'Publisher URI'
          '#role_uri__title': 'Role URI'
          '#vocab_personal_name': rdftype
          '#rdftype_personal_name': PersonalName
          '#vocab_corporate_name': rdftype
          '#rdftype_corporate_name': CorporateName
          '#vocab_family_name': rdftype
          '#rdftype_family_name': FamilyName
          '#role_type': customlod
          '#role_custom_lod': pbcore_creator_and_contributor_role_vocabulary
    language:
      '#type': webform_autocomplete
      '#title': Language
      '#multiple': 3
      '#help_title': Language
      '#help': 'Language(s) of the material(s)'
      '#title_display': before
      '#description_display': before
      '#states_clear': false
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__sorting': false
      '#multiple__add_more': false
      '#format_items': comma
      '#autocomplete_items': languages
  relationships_and_administrative_info:
    '#type': webform_wizard_page
    '#title': 'Relationships and Administrative Information'
    '#prev_button_label': 'Back to the previous step'
    '#next_button_label': 'Move on to next step'
    ismemberof:
      '#type': entity_autocomplete
      '#title': 'Part of Collection'
      '#unique': true
      '#states_clear': false
      '#format_items': comma
      '#target_type': node
      '#selection_handler': 'default:node'
      '#selection_settings':
        target_bundles:
          digital_object_collection: digital_object_collection
    ismemberofseries:
      '#type': entity_autocomplete
      '#title': 'Part of Series'
      '#unique': true
      '#states_clear': false
      '#format_items': comma
      '#target_type': node
      '#selection_handler': solr_views
      '#selection_settings':
        view:
          view_name: ado_selection_by_type
          display_name: entity_reference_solr_1
          arguments:
            - Series
    local_identifiers:
      '#type': webform_custom_composite
      '#title': Identifiers
      '#states_clear': false
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__sorting': false
      '#multiple__add_more': false
      '#element':
        source:
          '#type': webform_select_other
          '#options':
            'CAVAFY UUID': 'CAVAFY UUID'
            'DAVID Theme': 'DAVID Theme'
            'Publisher CMS Slug': 'Publisher CMS Slug'
            'Publisher CMS Primary Key': 'Publisher CMS Primary Key'
            'Simplecast Dashboard Link': 'Simplecast Dashboard Link'
            'Simplecast Episode ID': 'Simplecast Episode ID'
            'Simplecast Public Link': 'Simplecast Public Link'
            'Source Storage Path': 'Source Storage Path'
            'WNYC Archive Catalog Number': 'WNYC Archive Catalog Number'
            'WNYC Media Archive Label': 'WNYC Media Archive Label'
            'Archives Series Code': 'Archives Series Code'
          '#title': Source
        value:
          '#type': textfield
          '#title': Identifier
    rights:
      '#type': textarea
      '#title': 'Local Rights Statement'
      '#states_clear': false
      '#format_items': comma
    notes_details:
      '#type': details
      '#title': 'Notes and Other Information'
      '#states_clear': false
      note:
        '#type': textarea
        '#title': 'General Note'
        '#states_clear': false
        '#format_items': comma
      provenance:
        '#type': textarea
        '#title': Provenance
        '#states_clear': false
        '#format_items': comma
      annotations:
        '#type': webform_custom_composite
        '#title': Annotations
        '#states_clear': false
        '#multiple__min_items': 1
        '#multiple__empty_items': 0
        '#multiple__sorting': false
        '#multiple__add_more': false
        '#element':
          type:
            '#type': textarea
            '#title': Type
          value:
            '#type': textfield
            '#title': Value
  agent:
    '#type': webform_wizard_page
    '#title': 'Subjects and Other Classifications'
    '#open': true
    '#prev_button_label': 'Back to previous step'
    '#next_button_label': 'Next: Attach Files'
    subjects_markup:
      '#type': webform_markup
      '#markup': '<p>Subjects and other classification terms identify&nbsp;the names, places, subjects and formats associated with the object(s) being described.&nbsp;Please assign at least one term&nbsp;from a controlled source, such as the Library of Congress or Wikidata linked data vocabularies.</p>'
    pb_core_genre:
      '#type': details
      '#title': 'PB Core Genre'
      '#states_clear': false
      genres:
        '#type': webform_custom_composite
        '#title': Genres
        '#states_clear': false
        '#multiple__min_items': 1
        '#multiple__empty_items': 0
        '#multiple__sorting': false
        '#multiple__add_more': false
        '#element':
          label:
            '#type': textfield
            '#title': Label
          source:
            '#type': textfield
            '#title': Source
            '#placeholder': 'PBCore Genre Picklist'
    subjects_details:
      '#type': details
      '#title': 'Library of Congress Linked Data'
      '#states':
        expanded:
          '':
            '': ''
      '#states_clear': false
      subject_loc:
        '#type': webform_metadata_loc
        '#title': 'Library of Congress Subject Headings'
        '#multiple': 10
        '#multiple__header': true
        '#multiple__no_items_message': ''
        '#multiple__min_items': 1
        '#multiple__empty_items': 0
        '#multiple__sorting': false
        '#multiple__add_more': false
        '#multiple__add_more_input': false
        '#label__title': 'Subject Label'
        '#rdftype': ''
      subject_lcnaf_names:
        '#type': webform_metadata_loc
        '#title': 'LCNAF Names'
        '#multiple': 10
        '#multiple__header': true
        '#multiple__min_items': 1
        '#multiple__empty_items': 0
        '#multiple__sorting': false
        '#multiple__add_more': false
        '#multiple__add_more_input': false
        '#multiple__add_more_input_label': 'more LCNAF names'
        '#label__title': 'LCNAF Name Label'
        '#uri__title': 'LCNAF Name URL'
        '#vocab': names
        '#rdftype': ''
    other_subjects_detail:
      '#type': details
      '#title': 'Other Subjects'
      subject_other:
        '#type': webform_custom_composite
        '#title': 'Other Subjects'
        '#multiple': 10
        '#states_clear': false
        '#multiple__min_items': 1
        '#multiple__empty_items': 0
        '#multiple__sorting': false
        '#multiple__add_more': false
        '#element':
          label:
            '#type': textfield
            '#title': Label
          uri:
            '#type': textfield
            '#title': URI
    geographic_location_details:
      '#type': details
      '#title': 'Open Street Maps Location'
      geographic_location:
        '#type': webform_metadata_nominatim
        '#title': 'Open Streets Maps Location'
        '#description': 'Example: <em>Central Park, Manhattan, New York County, New York, United States of America</em>'
        '#help_title': Help
        '#help': |
          This is meant to describe a geographic location closely related to this Digital Object. Such as the origin of the object, where it was created, etc.<br />
          <br />
          Example: <em>Central Park, Manhattan, New York County, New York, United States of America</em>
        '#states_clear': false
        '#format_items': ol
        '#lat__access': true
        '#lng__access': true
        '#display_name__title': 'Display Name'
        '#display_name__access': true
        '#city__access': true
        '#country__access': true
  media:
    '#type': webform_wizard_page
    '#title': 'Upload Files'
    '#open': true
    '#prev_button_label': 'Back to previous step'
    images:
      '#type': webform_image_file
      '#title': 'Upload Image Files'
      '#multiple': 5
      '#states_clear': false
      '#format': custom
      '#format_html': '<img src="{{  item.link }}">'
      '#format_items': ol
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
      '#file_preview': ':image'
      '#max_filesize': '512'
      '#file_extensions': 'jp2 jpg jpeg png tif tiff'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Save Metadata'
    '#reset__label': 'Clear Form'
    '#preview_prev_hide': true
